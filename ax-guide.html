<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경남형 생성형 AI 활용 직무훈련 체계 안내</title>
    <!-- Pretendard 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #0f172a;      /* 다크 네이비 배경 */
            --rail-bg: #1e293b;       /* 좌측 레일 배경 */
            --text-main: #f8fafc;     /* 메인 텍스트 (화이트) */
            --text-muted: #94a3b8;    /* 보조 텍스트 (그레이) */
            --accent: #06b6d4;        /* 시안(Cyan) 포인트 컬러 */
            --accent-hover: #0891b2;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- 상단 헤더 영역 (수정됨) --- */
        .hero-section {
            text-align: center;
            padding: 5rem 2rem 4rem;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .top-title {
            font-size: 1rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        .description {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.8;
            word-break: keep-all;
            display: inline-block;
            text-align: center;
        }

        .description .highlight {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 1.3rem;
        }

        /* --- 레이아웃 (좌측 레일 + 우측 콘텐츠) --- */
        .layout-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
            position: relative;
        }

        /* --- 좌측 고정 레일 --- */
        .rail {
            width: 80px;
            flex-shrink: 0;
            position: sticky;
            top: 2rem;
            height: calc(100vh - 4rem);
            background-color: var(--rail-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .progress-wrapper {
            flex-grow: 1;
            width: 4px;
            background-color: #334155;
            border-radius: 4px;
            margin: 1.5rem 0;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: var(--accent);
            transition: height 0.2s ease-out;
        }

        .page-indicator {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .page-indicator span {
            color: var(--accent);
            font-size: 1.1rem;
        }

        /* --- 우측 슬라이드 콘텐츠 --- */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3rem; /* 슬라이드 간격 */
        }

        .slide-card {
            background-color: var(--rail-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .slide-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 호버 시 확대 툴팁 (pd-btn 기능 대체) */
        .slide-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .slide-card:hover .slide-overlay {
            opacity: 1;
        }

        .zoom-text {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--accent);
            border-radius: 30px;
            background: rgba(6, 182, 212, 0.2);
            backdrop-filter: blur(4px);
        }

        /* 반응형 처리 */
        @media (max-width: 768px) {
            .layout-container {
                flex-direction: column;
                padding: 1rem;
            }
            .rail {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem;
                border-radius: 8px;
            }
            .progress-wrapper {
                width: 50%;
                height: 4px;
                margin: 0;
            }
            .progress-bar {
                width: 0%;
                height: 100%;
                transition: width 0.2s ease-out;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 (불필요한 메뉴 모두 삭제됨) -->
    <header class="hero-section">
        <div class="top-title">경남형 생성형 AI 활용 직무훈련 체계 안내</div>
        <h1 class="main-title">경남형 생성형 AI 활용 직무훈련 체계(안)</h1>
        <p class="description">
            <span class="highlight">“모델을 만드는 교육”이 아니라 “업무를 자동화하는 교육”</span><br>
            — 현장 문제에서 출발해 반복업무를 없애고, 그 결과를 산출물과 성과로 남기는 훈련 설계입니다.
        </p>
    </header>

    <!-- 메인 레이아웃 -->
    <div class="layout-container">
        <!-- 스티키 좌측 레일 -->
        <aside class="rail">
            <div class="page-indicator">
                <span id="currentPage">1</span> / 19
            </div>
            <div class="progress-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </aside>

        <!-- 발표자료 콘텐츠 (총 19장) -->
        <main class="content-area" id="slideContainer">
            <!-- 자바스크립트로 19개의 슬라이드 카드가 자동 생성됩니다 -->
        </main>
    </div>

    <!-- 스크롤 및 슬라이드 생성 스크립트 -->
    <script>
        const totalPages = 19;
        const container = document.getElementById('slideContainer');
        const currentPageSpan = document.getElementById('currentPage');
        const progressBar = document.getElementById('progressBar');
        
        // 1. 19개의 슬라이드 카드 동적 생성 (실제 이미지 경로로 추후 수정 가능)
        for (let i = 1; i <= totalPages; i++) {
            const card = document.createElement('div');
            card.className = 'slide-card pd-btn';
            card.dataset.page = i;
            
            // 임시 플레이스홀더 텍스트 (실제 이미지 태그로 변경 가능: <img src="page1.jpg" alt="...">)
            card.innerHTML = `
                <div style="color: #475569; font-size: 2rem; font-weight: bold;">Page ${i}</div>
                <div class="slide-overlay">
                    <span class="zoom-text">확대보기</span>
                </div>
            `;
            container.appendChild(card);
        }

        const slides = document.querySelectorAll('.slide-card');

        // 2. 스크롤 진행률 및 현재 페이지 계산 (Intersection Observer 적용)
        const observerOptions = {
            root: null,
            rootMargin: '-50% 0px -50% 0px', // 화면 중앙에 오는 요소를 감지
            threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const pageNum = entry.target.dataset.page;
                    currentPageSpan.innerText = pageNum;
                    
                    // 데스크톱(세로 프로그래스 바) vs 모바일(가로 프로그래스 바) 처리
                    const progressPercent = ((pageNum - 1) / (totalPages - 1)) * 100;
                    if (window.innerWidth > 768) {
                        progressBar.style.height = `${progressPercent}%`;
                        progressBar.style.width = '100%';
                    } else {
                        progressBar.style.width = `${progressPercent}%`;
                        progressBar.style.height = '100%';
                    }
                }
            });
        }, observerOptions);

        slides.forEach(slide => observer.observe(slide));

        // 창 크기 변경 시 프로그래스 바 스타일 리셋 방지
        window.addEventListener('resize', () => {
            const currentPage = parseInt(currentPageSpan.innerText);
            const progressPercent = ((currentPage - 1) / (totalPages - 1)) * 100;
            
            if (window.innerWidth > 768) {
                progressBar.style.height = `${progressPercent}%`;
                progressBar.style.width = '100%';
            } else {
                progressBar.style.width = `${progressPercent}%`;
                progressBar.style.height = '100%';
            }
        });
    </script>
</body>
</html>
